const base=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',maxZoom:19}).addTo(map);
const M='https://geoide.minvu.cl/server/rest/services/IPT/';
function prc(path,label){
  const lyr=L.esri.dynamicMapLayer({url:M+path+'/MapServer',opacity:0.5});
  lyr.bindPopup(function(err,fc){
    if(err||!fc.features.length) return false;
    const p=fc.features[0].properties;
    const keys=Object.keys(p).filter(k=>/ZONA|USO|NOMBRE|DESCRIP|NORMA|IPT|PLAN|COMUNA|CONSTRUC|ALTURA|DENSID/i.test(k)).slice(0,8);
    if(!keys.length) return '<b>'+label+'</b><br>(sin atributos legibles)';
    return '<b>Plan Regulador — '+label+'</b><br>'+keys.map(k=>'<b>'+k+':</b> '+(p[k]??'')).join('<br>');
  });
  return lyr;
}
const prcRM=prc('PRC_Metropolitana','RM'), prcVA=prc('PRC_Valpara%C3%ADso','Valparaíso'), prcBB=prc('PRC_Biobio','Biobío');
prcRM.addTo(map); prcVA.addTo(map); prcBB.addTo(map);
const markers=L.layerGroup().addTo(map);
const b=L.latLngBounds();
pts.forEach((p,i)=>{
  L.circleMarker([p.lat,p.lon],{radius:6,color:'#222',weight:1.2,fillColor:COL[p.banda],fillOpacity:1})
   .bindPopup('<b>#'+(i+1)+' · '+p.nombre+'</b><br>'+p.comuna+' — '+p.region.replace(/^[0-9]+- ?/,'')+'<br><b>Score:</b> '+p.score+' ('+p.banda+')<br><b>Rol SII:</b> '+p.rol+'<br><b>Superficie:</b> '+p.m2.toLocaleString('es-CL')+' m²<br><b>Valor mercado est.:</b> US$ '+(p.usd/1e6).toFixed(1)+' MM')
   .addTo(markers);
  b.extend([p.lat,p.lon]);
});
const ctl=L.control.layers({'Mapa base':base},{'PRC Metropolitana':prcRM,'PRC Valparaíso':prcVA,'PRC Biobío':prcBB,'Predios (top 250)':markers},{collapsed:false}).addTo(map);
const t=L.control({position:'topright'});t.onAdd=()=>{const d=L.DomUtil.create('div','title');d.innerHTML='Top 250 predios + Plan Regulador (MINVU)';return d;};t.addTo(map);
const lg=L.control({position:'bottomright'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Probabilidad de venta</b><br>'+Object.entries(COL).map(([k,v])=>'<i style="background:'+v+'"></i>'+k).join('<br>')+'<hr style="margin:6px 0"><b>Áreas de color</b> = zonificación PRC.<br>Clic en una zona para ver su norma.';return d;};lg.addTo(map);
</script></body></html>
