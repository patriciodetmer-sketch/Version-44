const map=L.map('map').setView([-33.45,-70.66],11);
const base=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',maxZoom:19}).addTo(map);
const M='https://geoide.minvu.cl/server/rest/services/IPT/';
function prc(p){return L.esri.dynamicMapLayer({url:M+p+'/MapServer',opacity:0.4});}
const rmN=prc('PRC_RM_Norte'),rmS=prc('PRC_RM_Sur'),va=prc('PRC_Valpara%C3%ADso'),bb=prc('PRC_Biobio');
rmN.addTo(map);rmS.addTo(map);va.addTo(map);bb.addTo(map);
const potCls=v=>v&&v.startsWith('Alto')?'pA':(v&&v.startsWith('Medio')?'pM':(v&&v.startsWith('No')?'pN':'pB'));
function row(k,v){return v?'<div class="pr"><span class="pk">'+k+':</span> '+v+'</div>':'';}
function pop(d){
  let h='<div class="pp"><div class="ph">#'+d.i+' · '+d.n+'</div><div class="meta">'
   +'<div>'+d.com+' — '+d.reg+' · <b>Rol:</b> '+d.rol+'</div>'
   +'<div><b>Score:</b> '+d.sc+' ('+d.bd+') · <b>Sup.:</b> '+d.m2.toLocaleString('es-CL')+' m² · <b>Valor est.:</b> US$ '+(d.usd/1e6).toFixed(1)+' MM</div>'
   +'<div><span class="pot '+potCls(d.alt)+'">Altura: '+d.alt+'</span><span class="pot '+potCls(d.cm)+'">Comercial: '+d.cm+'</span><span class="pot '+potCls(d.ind)+'">Industrial: '+d.ind+'</span></div>'
   +'<div style="margin-top:3px"><b>Potencial:</b> '+d.pp+' — <span style="color:#666">'+d.ppj+'</span></div>'
   +'<div><a href="https://www.google.com/maps?q='+d.lat+','+d.lon+'" target="_blank" rel="noopener">📍 Ver en Google Maps</a></div></div>';
  h+='<div class="zh">Normativa Plan Regulador</div>';
  if(d.z||d.zn) h+='<div class="pz">'+(d.z||'')+(d.zn&&d.zn!==d.z?' — '+d.zn:'')+'</div>';
  h+=row('Uso permitido',d.up)+row('Uso prohibido',d.upr)+row('Instrumento',d.inst)
    +row('Publicación D.O.',d.fdo)+row('Documento',d.doc)+row('Sector',d.sec)+row('Observación',d.obs);
  h+='<div style="margin-top:5px"><a href="https://portalipt.minvu.cl/" target="_blank" rel="noopener">📄 Ordenanza completa en Portal IPT (MINVU)</a></div></div>';
  return h;
}
const markers=L.layerGroup().addTo(map); const bnd=L.latLngBounds();
R.forEach(d=>{
  L.circleMarker([d.lat,d.lon],{radius:6,color:'#111',weight:1.3,fillColor:COL[d.bd],fillOpacity:1})
   .bindPopup(pop(d),{maxWidth:380}).addTo(markers);
  bnd.extend([d.lat,d.lon]);
});
map.fitBounds(bnd.pad(.1));
L.control.layers({'Mapa base':base},{'PRC RM Norte':rmN,'PRC RM Sur':rmS,'PRC Valparaíso':va,'PRC Biobío':bb,'Predios (top 250)':markers},{collapsed:false}).addTo(map);
const t=L.control({position:'topright'});t.onAdd=()=>{const d=L.DomUtil.create('div','title');d.innerHTML='Clic en un predio → ficha + normativa completa (incrustada)';return d;};t.addTo(map);
const lg=L.control({position:'bottomright'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Probabilidad de venta</b><br>'+Object.entries(COL).map(([k,v])=>'<i style="background:'+v+'"></i>'+k).join('<br>')+'<hr style="margin:6px 0">Normativa de los 250 incrustada (funciona aunque MINVU esté caído).<br>Áreas de color = zonificación PRC (overlay MINVU).';return d;};lg.addTo(map);
</script></body></html>
